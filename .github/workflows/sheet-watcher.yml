name: Sheet Watcher

on:
  schedule:
    # Every 30 minutes, offset to avoid overlap with death-tracker (:15 past even hours)
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check sheet and update status.json
        run: |
          python3 - <<'EOF'
          import csv, io, json, time, urllib.request
          from pathlib import Path

          MEDIA_CSV_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuyztmxxkSGidHgZ5tWp6b3X-Te9xhYW6crNX1b9xUkemZD7fF0JGw6PgdccqX1zBIFHV8wXo8hmAy"
              "/pub?gid=0&single=true&output=csv"
          )
          SUMMARY_CSV_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuyztmxxkSGidHgZ5tWp6b3X-Te9xhYW6crNX1b9xUkemZD7fF0JGw6PgdccqX1zBIFHV8wXo8hmAy"
              "/pub?gid=2127819370&single=true&output=csv"
          )

          response = urllib.request.urlopen(MEDIA_CSV_URL)
          text = response.read().decode("utf-8")
          reader = csv.reader(io.StringIO(text))
          next(reader)  # skip header
          approved_count = sum(
              1 for row in reader
              if len(row) > 1 and row[0] and "/" in row[0] and row[1] not in ("Draft", "Rejected")
          )

          # Fetch H2 from the Summary sheet as the primary "last updated" timestamp
          sheet_last_updated = None
          try:
              summary_response = urllib.request.urlopen(SUMMARY_CSV_URL)
              summary_text = summary_response.read().decode("utf-8")
              summary_rows = list(csv.reader(io.StringIO(summary_text)))
              # H2 = row index 1, column index 7
              if len(summary_rows) > 1 and len(summary_rows[1]) > 7:
                  val = summary_rows[1][7].strip()
                  if val:
                      sheet_last_updated = val
                      print(f"Summary H2: {sheet_last_updated}")
          except Exception as e:
              print(f"Could not fetch Summary sheet: {e}")

          now_ms = int(time.time() * 1000)
          status_path = Path("status.json")

          prev = {}
          if status_path.exists():
              try:
                  prev = json.loads(status_path.read_text())
              except Exception:
                  pass

          last_updated_ms = prev.get("last_updated_ms", now_ms)
          if prev.get("approved_count") != approved_count:
              last_updated_ms = now_ms
              print(f"Sheet changed: {prev.get('approved_count')} -> {approved_count} approved")
          else:
              print(f"No change: {approved_count} approved")

          payload = {
              "last_checked_ms": now_ms,
              "last_updated_ms": last_updated_ms,
              "approved_count": approved_count,
          }
          if sheet_last_updated:
              payload["sheet_last_updated"] = sheet_last_updated

          status_path.write_text(json.dumps(payload))
          EOF

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp status.json /tmp/computed_status.json
          git pull origin main
          cp /tmp/computed_status.json status.json
          git add status.json
          git diff --staged --quiet || git commit -m "chore: update tracker status [skip ci]"
          git push || echo "Push skipped (concurrent write, will retry next run)"
