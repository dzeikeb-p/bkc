<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BKC Map</title>
  <link rel="icon" type="image/x-icon" href="/images/favi.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JPQMK6ZV0Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-JPQMK6ZV0Y');
  </script>

  <style>
    @font-face {
      font-family: 'LCDMono2';
      src: url('/fonts/LCDM2U__.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --page-bg: #f7f7f8;
      --card-bg: #ffffff;
      --card-border: rgba(0,0,0,0.08);
      --text-primary: #17181a;
      --text-muted: #6b6f76;
      --accent: #ec1111;
      --accent-pill-bg: rgba(236,17,17,0.09);
      --pill-bg: rgba(0,0,0,0.05);
      --input-bg: #f5f5f6;
      --hover-bg: rgba(0,0,0,0.045);
      --header-bg: #ffffff;
    }

    body.dark {
      --page-bg: #0f0f10;
      --card-bg: #18191b;
      --card-border: rgba(255,255,255,0.09);
      --text-primary: #f2f2f3;
      --text-muted: #9aa0a6;
      --accent-pill-bg: rgba(236,17,17,0.16);
      --pill-bg: rgba(255,255,255,0.07);
      --input-bg: #202124;
      --hover-bg: rgba(255,255,255,0.06);
      --header-bg: #18191b;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--page-bg);
      color: var(--text-primary);
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 28px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .brand-group { display: flex; align-items: center; gap: 22px; }
    .brand-link { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; }
    .brand-icon path { fill: currentColor; }
    .brand-text { font-size: 14px; font-weight: 800; letter-spacing: .4px; white-space: nowrap; }
    .nav-divider { width: 1px; height: 22px; background: var(--card-border); }

    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 20px;
      color: var(--text-muted); font-size: 13px; font-weight: 600; letter-spacing: .1px;
      white-space: nowrap; transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item i { font-size: 15px; width: 16px; text-align: center; }
    .nav-item:hover { background: var(--hover-bg); }
    .nav-item.active { color: var(--accent); background: var(--accent-pill-bg); }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 50%; color: var(--text-muted); cursor: pointer; font-size: 16px;
      transition: background 0.15s ease;
    }
    .theme-toggle:hover { background: var(--hover-bg); }

    @media (max-width: 640px) {
      .header { padding: 0 16px; height: 56px; }
      .brand-text, .nav-divider, .nav-item span { display: none; }
      .brand-group { gap: 14px; }
      .nav-item { padding: 10px; border-radius: 50%; }
    }

    .intro { flex-shrink: 0; padding: 22px 48px 4px; }
    .intro h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
    .intro p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

    .filters-container {
      flex-shrink: 0;
      margin: 14px 48px 0;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .filter-group { display: flex; flex-direction: column; }
    .filter-group label {
      font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      opacity: 0.65; margin-bottom: 3px; margin-left: 2px;
    }
    .filter-group select {
      padding: 8px 10px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 12.5px;
      min-width: 116px;
      background: var(--input-bg);
      color: var(--text-primary);
    }

    .filter-stats {
      margin-left: auto;
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .filter-stats .lcd { font-family: 'LCDMono2', monospace; font-size: 17px; color: var(--accent); }

    .clear-filters {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
    }
    .clear-filters:hover { background: var(--hover-bg); }

    #map { flex: 1; width: 100%; margin: 14px 48px 20px; border-radius: 12px; overflow: hidden; border: 1px solid var(--card-border); }

    .filter-toggle {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      margin: 12px 20px 0;
    }

    @media (max-width: 768px) {
      .intro { padding: 16px 18px 0; }
      .intro h1 { font-size: 19px; }
      .filter-toggle { display: flex; }

      .filters-container {
        display: none;
        margin: 8px 18px 0;
        flex-direction: column;
        align-items: stretch;
      }
      .filters-container.expanded { display: flex; }
      .filter-group { width: 100%; }
      .filter-group select { width: 100%; }
      .filter-stats { margin-left: 0; justify-content: center; }
      .clear-filters { justify-content: center; background: var(--pill-bg); }

      #map { margin: 8px 18px 16px; }
    }

    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text-primary);
    }
    .leaflet-popup-tip { background: var(--card-bg); }

    .popup-content { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; min-width: 190px; }
    .popup-date { font-family: 'LCDMono2', monospace; font-size: 14px; color: var(--accent); margin-bottom: 2px; }
    .popup-name { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
    .popup-name.unknown { font-style: italic; font-weight: 600; color: var(--text-muted); }
    .popup-loc { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
    .popup-pills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .popup-pill { padding: 3px 8px; border-radius: 20px; background: var(--pill-bg); font-size: 10.5px; color: var(--text-primary); }
    .popup-details { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
    .popup-link { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--accent); font-weight: 600; }

    .footer {
      flex-shrink: 0;
      padding: 10px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>

          <path fill="currentColor" d="M54.857 26.953v-6.676a94 94 0 0 0-2.18-1.085v7.082c.712.216 1.446.446 2.18.679m2.725.887v-6.123q-.831-.451-1.695-.904v6.472q.864.279 1.695.555m3.057 1.028c.511.175.97.332 1.361.469v-5.151c-.392-.226-.852-.488-1.361-.776zm-.696-.236v-5.614c-.494-.277-1.022-.57-1.574-.873v5.956q.829.278 1.574.531m-39.199-4.566c-1.621 1.637-2.129 3.775-1.137 4.778c.995 1.004 3.111.489 4.73-1.146c1.62-1.637 2.128-3.775 1.135-4.778s-3.11-.489-4.728 1.146"/>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTuyztmxxkSGidHgZ5tWp6b3X-Te9xhYW6crNX1b9xUkemZD7fF0JGw6PgdccqX1zBIFHV8wXo8hmAy/pub?gid=0&single=true&output=csv';

    const COLUMNS = {
      Date: 0, Status: 1, DOT: 2, FullLocation: 3, Location: 4, Name: 5, Year: 6,
      Time: 7, Age: 8, Gender: 9, Mode: 10, Details: 11, Suicide: 12, DOTMatch: 13,
      NewsSource: 14, Source: 15, Lat: 16, Lon: 17, GoogleMap: 18
    };

    let map;
    let markers = [];
    let allRecords = [];

    function initMap() {
      map = L.map('map').setView([26.7, -80.1], 9);

      const lightTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      });
      const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors © CARTO'
      });

      window.tileLayers = { light: lightTiles, dark: darkTiles };

      const isDark = document.body.classList.contains('dark');
      (isDark ? darkTiles : lightTiles).addTo(map);
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') { field += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          row.push(field.trim()); field = '';
        } else if ((char === '\n' || (char === '\r' && nextChar === '\n')) && !inQuotes) {
          if (char === '\r') i++;
          row.push(field.trim());
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = []; field = '';
        } else if (char !== '\r') { field += char; }
      }
      if (field || row.length > 0) { row.push(field.trim()); rows.push(row); }
      return rows;
    }

    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();
        const rows = parseCSV(text);

        allRecords = rows.slice(1).map(row => {
          while (row.length <= COLUMNS.GoogleMap) row.push('');
          return {
            date: row[COLUMNS.Date] || '',
            fullLocation: row[COLUMNS.FullLocation] || '',
            location: row[COLUMNS.Location] || '',
            name: row[COLUMNS.Name] || '',
            year: row[COLUMNS.Year] || '',
            age: row[COLUMNS.Age] || '',
            gender: row[COLUMNS.Gender] || '',
            mode: row[COLUMNS.Mode] || '',
            details: row[COLUMNS.Details] || '',
            suicide: row[COLUMNS.Suicide] || '',
            source: row[COLUMNS.Source] || '',
            lat: parseFloat(row[COLUMNS.Lat]) || null,
            lon: parseFloat(row[COLUMNS.Lon]) || null,
          };
        }).filter(r => r.lat && r.lon);

        populateFilters();
        applyUrlParams();
        renderMarkers();

        document.getElementById('total-count').textContent = allRecords.length;
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    function populateFilters() {
      const years = [...new Set(allRecords.map(r => r.year).filter(Boolean))].sort().reverse();
      const cities = [...new Set(allRecords.map(r => r.location).filter(Boolean))].sort();
      const modes = [...new Set(allRecords.map(r => r.mode).filter(Boolean))].sort();
      const genders = [...new Set(allRecords.map(r => r.gender).filter(Boolean))].sort();
      const suicides = [...new Set(allRecords.map(r => r.suicide).filter(Boolean))].sort();

      populateSelect('filter-year', years);
      populateSelect('filter-city', cities);
      populateSelect('filter-mode', modes);
      populateSelect('filter-gender', genders);
      populateSelect('filter-suicide', suicides);
    }

    function populateSelect(id, values) {
      const select = document.getElementById(id);
      const currentValue = select.value;
      const firstOption = select.options[0].outerHTML;
      select.innerHTML = firstOption;
      values.forEach(val => {
        const option = document.createElement('option');
        option.value = val;
        option.textContent = val;
        select.appendChild(option);
      });
      select.value = currentValue;
    }

    function getFilters() {
      return {
        year: document.getElementById('filter-year').value,
        city: document.getElementById('filter-city').value,
        mode: document.getElementById('filter-mode').value,
        gender: document.getElementById('filter-gender').value,
        suicide: document.getElementById('filter-suicide').value,
      };
    }

    function filterRecords() {
      if (specificRecordFilter) {
        return allRecords.filter(r =>
          r.date === specificRecordFilter.date &&
          Math.abs(r.lat - specificRecordFilter.lat) < 0.0001 &&
          Math.abs(r.lon - specificRecordFilter.lon) < 0.0001
        );
      }

      const filters = getFilters();
      return allRecords.filter(r => {
        if (filters.year && r.year !== filters.year) return false;
        if (filters.city && r.location !== filters.city) return false;
        if (filters.mode && r.mode !== filters.mode) return false;
        if (filters.gender && r.gender !== filters.gender) return false;
        if (filters.suicide && r.suicide !== filters.suicide) return false;
        return true;
      });
    }

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = filterRecords();

      filtered.forEach(record => {
        const marker = L.circleMarker([record.lat, record.lon], {
          radius: 8,
          fillColor: '#ec1111',
          color: '#fff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });

        let popupHtml = `<div class="popup-content">`;
        popupHtml += `<div class="popup-date">${escapeHtml(record.date)}</div>`;
        popupHtml += record.name
          ? `<div class="popup-name">${escapeHtml(record.name)}</div>`
          : `<div class="popup-name unknown">Unknown</div>`;
        const locLine = [record.location, record.fullLocation].filter(Boolean).join(' &middot; ');
        if (locLine) popupHtml += `<div class="popup-loc">${locLine}</div>`;

        popupHtml += `<div class="popup-pills">`;
        if (record.mode) popupHtml += `<span class="popup-pill">${escapeHtml(record.mode)}</span>`;
        if (record.age || record.gender) popupHtml += `<span class="popup-pill">${escapeHtml(record.age) || '&mdash;'} / ${escapeHtml(record.gender) || '&mdash;'}</span>`;
        popupHtml += `</div>`;

        if (record.details) popupHtml += `<div class="popup-details">${escapeHtml(record.details)}</div>`;

        if (record.source) {
          const sources = extractUrls(record.source);
          if (sources.length > 0) {
            popupHtml += `<a href="${escapeHtml(sources[0])}" target="_blank" class="popup-link"><i class="fa-solid fa-newspaper"></i> View article</a>`;
          }
        }
        popupHtml += `</div>`;

        marker.bindPopup(popupHtml);
        marker.addTo(map);
        markers.push(marker);
      });

      document.getElementById('visible-count').textContent = filtered.length;

      if (markers.length > 0) {
        if (specificRecordFilter && markers.length === 1) {
          map.setView([filtered[0].lat, filtered[0].lon], 15);
          markers[0].openPopup();
        } else {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.1));
        }
      }

      if (!specificRecordFilter) updateUrl();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function extractUrls(sourceStr) {
      const delimiters = /[,\n\r]+/;
      const parts = sourceStr.split(delimiters).map(s => s.trim()).filter(Boolean);
      if (parts.length > 0 && parts.every(p => p.startsWith('http'))) return parts;
      const urlRegex = /https?:\/\/[^\s,\n\r]+/g;
      const matches = sourceStr.match(urlRegex);
      return matches || [];
    }

    let specificRecordFilter = null;

    function applyUrlParams() {
      const params = new URLSearchParams(window.location.search);

      if (params.has('lat') && params.has('lon') && params.has('date')) {
        specificRecordFilter = {
          lat: parseFloat(params.get('lat')),
          lon: parseFloat(params.get('lon')),
          date: params.get('date')
        };
      }

      if (params.has('year')) document.getElementById('filter-year').value = params.get('year');
      if (params.has('city')) document.getElementById('filter-city').value = params.get('city');
      if (params.has('mode')) document.getElementById('filter-mode').value = params.get('mode');
      if (params.has('gender')) document.getElementById('filter-gender').value = params.get('gender');
      if (params.has('suicide')) document.getElementById('filter-suicide').value = params.get('suicide');
    }

    function updateUrl() {
      const filters = getFilters();
      const params = new URLSearchParams();
      if (filters.year) params.set('year', filters.year);
      if (filters.city) params.set('city', filters.city);
      if (filters.mode) params.set('mode', filters.mode);
      if (filters.gender) params.set('gender', filters.gender);
      if (filters.suicide) params.set('suicide', filters.suicide);

      const newUrl = params.toString() ? `${window.location.pathname}?${params}` : window.location.pathname;
      window.history.replaceState({}, '', newUrl);
    }

    function clearFilters() {
      specificRecordFilter = null;
      document.getElementById('filter-year').value = '';
      document.getElementById('filter-city').value = '';
      document.getElementById('filter-mode').value = '';
      document.getElementById('filter-gender').value = '';
      document.getElementById('filter-suicide').value = '';
      window.history.replaceState({}, '', window.location.pathname);
      renderMarkers();
    }

    function setTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
      document.getElementById('themeIcon').className =
        theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

      if (window.tileLayers) {
        if (theme === 'dark') {
          map.removeLayer(window.tileLayers.light);
          window.tileLayers.dark.addTo(map);
        } else {
          map.removeLayer(window.tileLayers.dark);
          window.tileLayers.light.addTo(map);
        }
      }
    }

    function toggleFilters() {
      const container = document.getElementById('filtersContainer');
      const toggleText = document.getElementById('filterToggleText');
      container.classList.toggle('expanded');
      toggleText.textContent = container.classList.contains('expanded') ? 'Hide Filters' : 'Show Filters';
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    document.querySelectorAll('.filter-group select').forEach(select => {
      select.addEventListener('change', () => {
        if (specificRecordFilter) {
          specificRecordFilter = null;
          window.history.replaceState({}, '', window.location.pathname);
        }
        renderMarkers();
      });
    });

    async function fetchTrackerStatus() {
      try {
        const resp = await fetch('/status.json');
        if (!resp.ok) return;
        const s = await resp.json();
        const el = document.getElementById('tracker-status');
        if (!el) return;
        const fmt = ms => new Date(ms).toUTCString().replace(' GMT', ' UTC');
        if (s.sheet_last_updated) {
          el.textContent = 'Last updated: ' + s.sheet_last_updated;
        } else if (s.last_updated_ms) {
          el.textContent = 'Last updated: ' + fmt(s.last_updated_ms);
        }
      } catch (e) { /* status.json not yet present */ }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      }

      initMap();
      setTheme(savedTheme);
      fetchData();
      fetchTrackerStatus();
    });
  </script>
</body>
</html>
