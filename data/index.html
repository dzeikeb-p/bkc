<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BKC Data</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JPQMK6ZV0Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-JPQMK6ZV0Y');

  <style>
    @font-face {
      font-family: 'LCDMono2';
      src: url('/fonts/LCDM2U__.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --page-bg: #f7f7f8;
      --card-bg: #ffffff;
      --card-border: rgba(0,0,0,0.08);
      --text-primary: #17181a;
      --text-muted: #6b6f76;
      --accent: #ec1111;
      --accent-pill-bg: rgba(236,17,17,0.09);
      --pill-bg: rgba(0,0,0,0.05);
      --input-bg: #f5f5f6;
      --hover-bg: rgba(0,0,0,0.045);
      --header-bg: #ffffff;
      --head-bg: #fafafb;
      --row-b: #fbfbfc;
      --shadow-color: rgba(0,0,0,0.06);
    }

    body.dark {
      --page-bg: #0f0f10;
      --card-bg: #18191b;
      --card-border: rgba(255,255,255,0.09);
      --text-primary: #f2f2f3;
      --text-muted: #9aa0a6;
      --accent-pill-bg: rgba(236,17,17,0.16);
      --pill-bg: rgba(255,255,255,0.07);
      --input-bg: #202124;
      --hover-bg: rgba(255,255,255,0.06);
      --header-bg: #18191b;
      --head-bg: #202124;
      --row-b: rgba(255,255,255,0.025);
      --shadow-color: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--page-bg);
      color: var(--text-primary);
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 28px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .brand-group { display: flex; align-items: center; gap: 22px; }
    .brand-link { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; }
    .brand-icon path { fill: currentColor; }
    .brand-text { font-size: 14px; font-weight: 800; letter-spacing: .4px; white-space: nowrap; }
    .nav-divider { width: 1px; height: 22px; background: var(--card-border); }

    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 20px;
      color: var(--text-muted); font-size: 13px; font-weight: 600; letter-spacing: .1px;
      white-space: nowrap; transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item i { font-size: 15px; width: 16px; text-align: center; }
    .nav-item:hover { background: var(--hover-bg); }
    .nav-item.active { color: var(--accent); background: var(--accent-pill-bg); }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 50%; color: var(--text-muted); cursor: pointer; font-size: 16px;
      transition: background 0.15s ease;
    }
    .theme-toggle:hover { background: var(--hover-bg); }

    @media (max-width: 640px) {
      .header { padding: 0 16px; height: 56px; }
      .brand-text, .nav-divider, .nav-item span { display: none; }
      .brand-group { gap: 14px; }
      .nav-item { padding: 10px; border-radius: 50%; }
    }

    /* Page intro */
    .intro { padding: 26px 48px 0; flex-shrink: 0; }
    .intro h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
    .intro p { margin: 0; font-size: 14px; color: var(--text-muted); }

    /* Controls bar */
    .controls-container {
      position: sticky;
      top: 64px;
      z-index: 15;
      margin: 18px 48px 0;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 4px 14px var(--shadow-color);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--input-bg);
      color: var(--text-primary);
    }

    .filter-group { display: flex; flex-direction: column; }
    .filter-group label {
      font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      opacity: 0.65; margin-bottom: 3px; margin-left: 2px;
    }
    .filter-group select {
      padding: 8px 10px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 12.5px;
      min-width: 108px;
      background: var(--input-bg);
      color: var(--text-primary);
    }

    .stats {
      margin-left: auto;
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .stats .lcd { font-family: 'LCDMono2', monospace; font-size: 17px; }
    .stats .lcd.visible { color: var(--accent); }
    .stats .lcd.total { color: var(--text-primary); }

    .clear-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
    }
    .clear-btn:hover { background: var(--hover-bg); }

    .filter-toggle {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      margin: 14px 20px 0;
    }

    @media (max-width: 768px) {
      .intro { padding: 20px 18px 0; }
      .intro h1 { font-size: 20px; }
      .filter-toggle { display: flex; }

      .controls-container {
        display: none;
        margin: 10px 18px 0;
        top: 56px;
        flex-direction: column;
        align-items: stretch;
      }
      .controls-container.expanded { display: flex; }
      .search-box { max-width: none; width: 100%; }
      .filter-group { width: 100%; }
      .filter-group select { width: 100%; }
      .stats { margin-left: 0; margin-top: 4px; justify-content: center; }
      .clear-btn { width: 100%; justify-content: center; background: var(--pill-bg); }
    }

    /* Desktop table */
    .table-wrapper {
      flex: 1;
      overflow: auto;
      margin: 20px 48px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      text-align: left;
      padding: 13px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
      background: var(--head-bg);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    thead th.sorted { color: var(--accent); }
    th .sort-icon { margin-left: 5px; opacity: 0.45; font-size: 10px; }
    th.sorted .sort-icon { opacity: 1; }

    td { padding: 14px 16px; border-top: 1px solid var(--card-border); vertical-align: top; }
    tbody tr:nth-child(even) { background: var(--row-b); }

    .col-date { font-family: 'LCDMono2', monospace; font-size: 15px; color: var(--accent); white-space: nowrap; }
    .name-cell { font-weight: 600; color: var(--text-primary); }
    .name-cell.unknown { font-weight: 600; font-style: italic; color: var(--text-muted); }
    .loc-city { color: var(--text-primary); font-weight: 500; }
    .loc-full { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--pill-bg);
      font-size: 11.5px;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .pill.accent { background: var(--accent-pill-bg); color: var(--accent); font-weight: 600; }

    .details-cell {
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
    }
    .details-cell:hover { white-space: normal; overflow: visible; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 26px;
      height: 26px;
      padding: 0 8px;
      border-radius: 20px;
      background: var(--pill-bg);
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      font-size: 11.5px;
    }
    .icon-btn.with-count { width: auto; }
    .icon-btn:hover { color: var(--accent); }

    .no-results { text-align: center; padding: 40px; font-size: 15px; opacity: 0.7; }

    /* Source dropdown */
    .source-dropdown { position: relative; display: inline-block; }
    .source-dropdown-content {
      display: none;
      position: absolute;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      min-width: 190px;
      max-width: 320px;
      box-shadow: 0 8px 20px var(--shadow-color);
      border-radius: 10px;
      z-index: 30;
      right: 0;
      bottom: 100%;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .source-dropdown-content.show { display: block; }
    .source-dropdown-content a {
      display: block;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-primary);
      border-top: 1px solid var(--card-border);
    }
    .source-dropdown-content a:first-child { border-top: none; }
    .source-dropdown-content a:hover { background: var(--pill-bg); color: var(--accent); }

    /* Mobile card list */
    .card-list { display: none; flex: 1; overflow: auto; padding: 6px 18px 24px; flex-direction: column; gap: 12px; }

    .record-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
    }
    .record-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .record-card .col-date { font-size: 14px; margin-bottom: 2px; }
    .record-card-loc { margin-top: 8px; font-size: 12.5px; color: var(--text-primary); font-weight: 500; }
    .record-card-loc span { color: var(--text-muted); font-weight: 400; }
    .record-card-badges { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .record-card-details { margin: 10px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--text-muted); }
    .record-card-footer {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: space-between;
    }

    @media (max-width: 768px) {
      .table-wrapper { display: none; }
      .card-list { display: flex; }
    }

    .footer {
      padding: 12px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      flex-shrink: 0;
    }

  </style>
</head>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTuyztmxxkSGidHgZ5tWp6b3X-Te9xhYW6crNX1b9xUkemZD7fF0JGw6PgdccqX1zBIFHV8wXo8hmAy/pub?gid=0&single=true&output=csv';

    const COLUMNS = {
      Date: 0, Status: 1, DOT: 2, FullLocation: 3, Location: 4, Name: 5, Year: 6,
      Time: 7, Age: 8, Gender: 9, Mode: 10, Details: 11, Suicide: 12, DOTMatch: 13,
      NewsSource: 14, Source: 15, Lat: 16, Lon: 17, GoogleMap: 18
    };

    let allRecords = [];
    let sortColumn = 'date';
    let sortDirection = 'desc';

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') { field += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          row.push(field.trim()); field = '';
        } else if ((char === '\n' || (char === '\r' && nextChar === '\n')) && !inQuotes) {
          if (char === '\r') i++;
          row.push(field.trim());
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = []; field = '';
        } else if (char !== '\r') { field += char; }
      }
      if (field || row.length > 0) { row.push(field.trim()); rows.push(row); }
      return rows;
    }

    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const month = parseInt(parts[0], 10) - 1;
        const day = parseInt(parts[1], 10);
        let year = parseInt(parts[2], 10);
        if (year < 100) year += 2000;
        return new Date(year, month, day);
      }
      return new Date(0);
    }

    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();
        const rows = parseCSV(text);

        allRecords = rows.slice(1).filter(row => row[COLUMNS.Status] !== 'Draft' && row[COLUMNS.Status] !== 'Rejected').map(row => {
          while (row.length <= COLUMNS.GoogleMap) row.push('');
          return {
            date: row[COLUMNS.Date] || '',
            dateObj: parseDate(row[COLUMNS.Date]),
            fullLocation: row[COLUMNS.FullLocation] || '',
            location: row[COLUMNS.Location] || '',
            name: row[COLUMNS.Name] || '',
            year: row[COLUMNS.Year] || '',
            age: row[COLUMNS.Age] || '',
            ageNum: parseInt(row[COLUMNS.Age]) || 0,
            gender: row[COLUMNS.Gender] || '',
            mode: row[COLUMNS.Mode] || '',
            details: row[COLUMNS.Details] || '',
            suicide: row[COLUMNS.Suicide] || '',
            source: row[COLUMNS.Source] || '',
            lat: row[COLUMNS.Lat] || '',
            lon: row[COLUMNS.Lon] || '',
            googleMap: row[COLUMNS.GoogleMap] || '',
          };
        });

        populateFilters();
        renderAll();
        document.getElementById('total-count').textContent = allRecords.length;
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    function populateFilters() {
      const years = [...new Set(allRecords.map(r => r.year).filter(Boolean))].sort().reverse();
      const cities = [...new Set(allRecords.map(r => r.location).filter(Boolean))].sort();
      const modes = [...new Set(allRecords.map(r => r.mode).filter(Boolean))].sort();
      const genders = [...new Set(allRecords.map(r => r.gender).filter(Boolean))].sort();
      const suicides = [...new Set(allRecords.map(r => r.suicide).filter(Boolean))].sort();

      populateSelect('filter-year', years);
      populateSelect('filter-city', cities);
      populateSelect('filter-mode', modes);
      populateSelect('filter-gender', genders);
      populateSelect('filter-suicide', suicides);
    }

    function populateSelect(id, values) {
      const select = document.getElementById(id);
      const firstOption = select.options[0].outerHTML;
      select.innerHTML = firstOption;
      values.forEach(val => {
        const option = document.createElement('option');
        option.value = val;
        option.textContent = val;
        select.appendChild(option);
      });
    }

    function getFilters() {
      return {
        search: document.getElementById('search').value.toLowerCase(),
        year: document.getElementById('filter-year').value,
        city: document.getElementById('filter-city').value,
        mode: document.getElementById('filter-mode').value,
        gender: document.getElementById('filter-gender').value,
        suicide: document.getElementById('filter-suicide').value,
      };
    }

    function getFilteredRecords() {
      const filters = getFilters();

      let filtered = allRecords.filter(r => {
        if (filters.year && r.year !== filters.year) return false;
        if (filters.city && r.location !== filters.city) return false;
        if (filters.mode && r.mode !== filters.mode) return false;
        if (filters.gender && r.gender !== filters.gender) return false;
        if (filters.suicide && r.suicide !== filters.suicide) return false;

        if (filters.search) {
          const searchFields = [r.name, r.location, r.fullLocation, r.details, r.date].join(' ').toLowerCase();
          if (!searchFields.includes(filters.search)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        let valA, valB;
        switch (sortColumn) {
          case 'date': valA = a.dateObj; valB = b.dateObj; break;
          case 'age': valA = a.ageNum; valB = b.ageNum; break;
          case 'location': valA = (a.location || '').toLowerCase(); valB = (b.location || '').toLowerCase(); break;
          default:
            valA = (a[sortColumn] || '').toLowerCase();
            valB = (b[sortColumn] || '').toLowerCase();
        }
        if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
        if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
        return 0;
      });

      return filtered;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getSourceName(url) {
      try {
        const hostname = new URL(url).hostname.replace('www.', '');
        const parts = hostname.split('.');
        if (parts.length >= 2) {
          let name = parts[parts.length - 2];
          const nameMap = {
            'sun-sentinel': 'Sun Sentinel', 'miamiherald': 'Miami Herald',
            'palmbeachpost': 'Palm Beach Post', 'orlandosentinel': 'Orlando Sentinel',
            'local10': 'Local 10', 'wptv': 'WPTV', 'tcpalm': 'TC Palm', 'wsvn': 'WSVN',
            'nbcmiami': 'NBC Miami', 'cbsnews': 'CBS News', 'nytimes': 'NY Times',
            'washingtonpost': 'Washington Post', 'cnn': 'CNN', 'foxnews': 'Fox News',
            'abcnews': 'ABC News', 'wesh': 'WESH', 'clickorlando': 'Click Orlando',
            'news-journalonline': 'News Journal', 'floridatoday': 'Florida Today',
          };
          return nameMap[name.toLowerCase()] || name.charAt(0).toUpperCase() + name.slice(1);
        }
        return hostname;
      } catch { return 'Source'; }
    }

    function extractSources(sourceStr) {
      let sources = [];
      const delimiters = /[,\n\r]+/;
      const parts = sourceStr.split(delimiters).map(s => s.trim()).filter(Boolean);
      if (parts.length > 0 && parts.every(p => p.startsWith('http'))) {
        sources = parts;
      } else {
        const urlRegex = /https?:\/\/[^\s,\n\r]+/g;
        const matches = sourceStr.match(urlRegex);
        sources = matches || [];
      }
      return sources;
    }

    function formatSources(sourceStr, rowIndex) {
      const sources = extractSources(sourceStr);
      if (sources.length === 0) return '';

      if (sources.length === 1) {
        return `<a href="${escapeHtml(sources[0])}" target="_blank" class="icon-btn" title="${getSourceName(sources[0])}"><i class="fa-solid fa-newspaper"></i></a>`;
      }

      const dropdownId = `dropdown-${rowIndex}`;
      const dropdownItems = sources.map(url => {
        const name = getSourceName(url);
        return `<a href="${escapeHtml(url)}" target="_blank">${escapeHtml(name)}</a>`;
      }).join('');

      return `
        <div class="source-dropdown">
          <button class="icon-btn with-count" onclick="toggleDropdown('${dropdownId}', event)" title="${sources.length} sources">
            <i class="fa-solid fa-newspaper"></i><span>${sources.length}</span>
          </button>
          <div class="source-dropdown-content" id="${dropdownId}">${dropdownItems}</div>
        </div>
      `;
    }

    function toggleDropdown(dropdownId, event) {
      event.stopPropagation();
      document.querySelectorAll('.source-dropdown-content.show').forEach(el => {
        if (el.id !== dropdownId) el.classList.remove('show');
      });
      document.getElementById(dropdownId).classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
      if (!event.target.closest('.source-dropdown')) {
        document.querySelectorAll('.source-dropdown-content.show').forEach(el => el.classList.remove('show'));
      }
    });

    function mapLink(r) {
      if (!r.lat || !r.lon) return '';
      return `/map?lat=${r.lat}&lon=${r.lon}&date=${encodeURIComponent(r.date)}`;
    }

    function suicidePillClass(value) {
      return value === 'Confirmed' ? 'pill accent' : 'pill';
    }

    // Render desktop table
    function renderTable(filtered) {
      const tbody = document.getElementById('table-body');
      const noResults = document.getElementById('no-results');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      tbody.innerHTML = filtered.map((r, index) => `
        <tr>
          <td class="col-date">${escapeHtml(r.date)}</td>
          <td class="${r.name ? 'name-cell' : 'name-cell unknown'}">${r.name ? escapeHtml(r.name) : 'Unknown'}</td>
          <td>
            <div class="loc-city">${escapeHtml(r.location)}</div>
            <div class="loc-full">${escapeHtml(r.fullLocation)}</div>
          </td>
          <td>${escapeHtml(r.age) || '&mdash;'} / ${escapeHtml(r.gender) || '&mdash;'}</td>
          <td>${r.mode ? `<span class="pill">${escapeHtml(r.mode)}</span>` : ''}</td>
          <td>${r.suicide ? `<span class="${suicidePillClass(r.suicide)}">${escapeHtml(r.suicide)}</span>` : ''}</td>
          <td class="details-cell" title="${escapeHtml(r.details)}">${escapeHtml(r.details)}</td>
          <td style="text-align:center;">${r.source ? formatSources(r.source, index) : ''}</td>
          <td style="text-align:center;">${mapLink(r) ? `<a href="${mapLink(r)}" class="icon-btn" title="View on map"><i class="fa-solid fa-location-dot"></i></a>` : ''}</td>
        </tr>
      `).join('');
    }

    // Render mobile card list
    function renderCards(filtered) {
      const container = document.getElementById('card-list');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">No records match your filters.</div>';
        return;
      }

      container.innerHTML = filtered.map((r, index) => `
        <div class="record-card">
          <div class="record-card-top">
            <div>
              <div class="col-date">${escapeHtml(r.date)}</div>
              <div class="${r.name ? 'name-cell' : 'name-cell unknown'}">${r.name ? escapeHtml(r.name) : 'Unknown'}</div>
            </div>
            ${r.suicide ? `<span class="${suicidePillClass(r.suicide)}">${escapeHtml(r.suicide)}</span>` : ''}
          </div>
          <div class="record-card-loc">${escapeHtml(r.location)} ${r.fullLocation ? `<span>&middot; ${escapeHtml(r.fullLocation)}</span>` : ''}</div>
          <div class="record-card-badges">
            ${r.mode ? `<span class="pill">${escapeHtml(r.mode)}</span>` : ''}
            <span class="pill">${escapeHtml(r.age) || '&mdash;'} / ${escapeHtml(r.gender) || '&mdash;'}</span>
          </div>
          ${r.details ? `<p class="record-card-details">${escapeHtml(r.details)}</p>` : ''}
          <div class="record-card-footer">
            ${r.source ? formatSources(r.source, 'm' + index) : '<span></span>'}
            ${mapLink(r) ? `<a href="${mapLink(r)}" class="icon-btn" title="View on map"><i class="fa-solid fa-location-dot"></i></a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderAll() {
      const filtered = getFilteredRecords();
      renderTable(filtered);
      renderCards(filtered);
      document.getElementById('visible-count').textContent = filtered.length;
      updateSortIcons();
    }

    function updateSortIcons() {
      document.querySelectorAll('th[data-sort]').forEach(th => {
        const icon = th.querySelector('.sort-icon i');
        if (th.dataset.sort === sortColumn) {
          th.classList.add('sorted');
          icon.className = sortDirection === 'asc' ? 'fa-solid fa-sort-up' : 'fa-solid fa-sort-down';
        } else {
          th.classList.remove('sorted');
          icon.className = 'fa-solid fa-sort';
        }
      });
    }

    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const column = th.dataset.sort;
        if (sortColumn === column) {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          sortColumn = column;
          sortDirection = column === 'date' ? 'desc' : 'asc';
        }
        renderAll();
      });
    });

    function clearAll() {
      document.getElementById('search').value = '';
      document.getElementById('filter-year').value = '';
      document.getElementById('filter-city').value = '';
      document.getElementById('filter-mode').value = '';
      document.getElementById('filter-gender').value = '';
      document.getElementById('filter-suicide').value = '';
      renderAll();
    }

    document.getElementById('search').addEventListener('input', debounce(renderAll, 300));
    document.querySelectorAll('.filter-group select').forEach(select => {
      select.addEventListener('change', renderAll);
    });

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function toggleFilters() {
      const container = document.getElementById('filtersContainer');
      const toggleText = document.getElementById('filterToggleText');
      container.classList.toggle('expanded');
      toggleText.textContent = container.classList.contains('expanded') ? 'Hide Filters' : 'Show Filters';
    }

    function setTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
      document.getElementById('themeIcon').className =
        theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    async function fetchTrackerStatus() {
      try {
        const resp = await fetch('/status.json');
        if (!resp.ok) return;
        const s = await resp.json();
        const el = document.getElementById('tracker-status');
        if (!el) return;
        const fmt = ms => new Date(ms).toUTCString().replace(' GMT', ' UTC');
        if (s.sheet_last_updated) {
          el.textContent = 'Last updated: ' + s.sheet_last_updated;
        } else if (s.last_updated_ms) {
          el.textContent = 'Last updated: ' + fmt(s.last_updated_ms);
        }
      } catch (e) { /* status.json not yet present */ }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      }
      fetchData();
      fetchTrackerStatus();
    });
  </script>
</body>
</html>
